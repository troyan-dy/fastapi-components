repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: format
        name: format
        entry: make format
        language: system
        pass_filenames: false
        types: [python]
      - id: lint
        name: lint (mypy, flake8 + wemake-python-styleguide)
        entry: make lint
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest-check
        name: pytest-check
        entry: make test
        language: system
        pass_filenames: false
        types: [python]
