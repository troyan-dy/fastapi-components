[project]
name = "fastapi-components"
version = "0.4.1"
description = "This library makes it easy to add dependencies to your fastapi service"
authors = [{ name = "Dmitriy Troyan", email = "kashil.dima@yandex.ru" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<4.0"
dependencies = [
    "loguru>=0.7.3,<0.8",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
]

[project.optional-dependencies]
redis = ["aioredis>=1.3.1,<2"]
postgres = ["aiopg>=1.4,<2", "sqlalchemy>=1.4.54,<1.5"]
kafka = ["aiokafka>=0.14,<0.15"]
web = ["uvicorn[standard]>=0.54", "fastapi>=0.162"]
mongo = ["motor>=3.7.1,<4"]
aiohttp = ["aiohttp>=3.14,<4"]
all = [
    "aioredis>=1.3.1,<2",
    "aiopg>=1.4,<2",
    "sqlalchemy>=1.4.54,<1.5",
    "aiokafka>=0.14,<0.15",
    "uvicorn[standard]>=0.54",
    "fastapi>=0.162",
    "motor>=3.7.1,<4",
    "aiohttp>=3.14,<4",
    # aiopg needs async-timeout<5; pinning it here keeps a single version for `-E all`
    "async-timeout>=4.0.3,<5",
]

[tool.poetry]
packages = [{ include = "fastapi_components" }]

[tool.poetry.group.dev.dependencies]
black = "^26.10"
isort = "^9.0"
mypy = "^2.4"
pytest = "^9.1"
flake8 = "^7.4"
testcontainers = "^4.15"
pytest-asyncio = "^1.4"
ipdb = "^0.13.13"
aioresponses = "^0.7.9"
async-asgi-testclient = "^1.4.11"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ['py311']

[tool.isort]
line_length=120
multi_line_output=3
include_trailing_comma=true
force_grid_wrap=0
use_parentheses=true
